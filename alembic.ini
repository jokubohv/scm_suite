# Alembic configuration for the Inventory Platform (single additive chain).
#
# Authority: design/DATA-MODEL.md §21.1 (revision map) + design/parallel-plan.json (chain protocol).
# This file contains NO credentials: app/migrations/env.py resolves the database URL from
# DATABASE_URL (preferred) or the app settings (app/core/config.py). Never commit a real URL here.
#
# Migration chain rules (enforced by ``python -m app.migrations.chain_guard``):
#   * one linear chain, exactly one head;
#   * every revision id is ``NNNN_slug`` with a 4-digit prefix (0001…0030);
#   * prefixes are contiguous from 0001 with no gaps and never reused;
#   * domain revisions are authored by their feature set and merged in chain order by the integrator.
#
# Generate a revision (builders pass the pre-allocated number explicitly):
#   alembic -c alembic.ini revision --rev-id 0004_item_master -m "item master core"
# Validate the chain without a database:
#   python -m app.migrations.chain_guard
# Apply:
#   alembic -c alembic.ini upgrade head

[alembic]
script_location = app/migrations
prepend_sys_path = .
version_path_separator = os
# filename = <revision>_<slug>.py (Alembic also embeds the revision id as the script id)
file_template = %%(rev)s_%%(slug)s
# Empty on purpose — env.py reads DATABASE_URL / app settings (asyncpg URL) and never logs secrets.
sqlalchemy.url =
# Deterministic, drift-free autogenerate comparisons (see app/migrations/README.md).
compare_type = true
compare_server_default = true
# NOTE: plain `alembic revision` does not load env.py (no DB needed). Always pass the pre-allocated
# --rev-id, or use scripts/new_migration.sh; the chain guard rejects random ids in CI.

[post_write_hooks]
# Intentionally empty: formatting/linting is owned by the repo toolchain (ruff), not Alembic.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
