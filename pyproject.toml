[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-platform"
version = "0.1.0"
description = "NetSuite-like multi-tenant inventory/manufacturing backend (Phase 1)"
readme = "README.IMPLEMENTATION.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi==0.138.0",
  "uvicorn[standard]>=0.30",
  "pydantic==2.13.4",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "rq>=1.16",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "minio>=7.2",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "testcontainers[postgres]>=4.8",
  "import-linter>=2.0",
  "schemathesis>=3.35",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests", "app/migrations/tests", "app/seed/tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "integration: requires postgres/redis (compose or testcontainers)",
  "contract: contract/provider-consumer suites",
  "slow: long-running suites",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/migrations/versions", "contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = "app/migrations/versions|app/tests|app/migrations/tests|app/seed/tests"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/migrations/*"]
