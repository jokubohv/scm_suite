name: ci

on:
  push:
    branches: [main, "integration/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan gates (manifest, RBAC, coverage, render, parallel plan)
        run: |
          python tools/feature_sets.py validate
          python tools/feature_sets.py permissions
          python tools/feature_sets.py coverage
          python tools/render_plan_tables.py --check
          python tools/check_parallel_plan.py
          python tools/check_parallel_plan.py --s0 || echo "S0 scaffold not complete yet (expected before FS-00)"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_PROFILE: url
      TEST_DATABASE_URL: postgresql+asyncpg://inventory:inventory@localhost:5432/inventory
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@localhost:5432/inventory
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check app
      - name: Type check
        run: mypy app
      - name: Migrate test database
        run: python -m alembic upgrade head
      - name: Tests
        run: pytest -q
      - name: Compose config
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose config -q
      - name: Contract lint (if present)
        run: |
          if python -c "import app.contracts.cli" 2>/dev/null; then
            python -m app.contracts.cli lint
          fi
