name: deploy-vps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_PROFILE: url
      TEST_DATABASE_URL: postgresql+asyncpg://inventory:inventory@localhost:5432/inventory
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@localhost:5432/inventory
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Migrate test database
        run: python -m alembic upgrade head
      - name: Plan + contract gates
        run: |
          python tools/feature_sets.py validate
          python tools/feature_sets.py permissions
          python tools/feature_sets.py coverage
          python -m app.contracts.cli generate --check
          python -m app.contracts.cli lint
          python tools/export_runtime_openapi.py --check
      - name: Tests
        run: pytest -q

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Compute lowercase image reference
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/scm-suite-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build-push.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Trust the deployment host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy deployment files
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p '${{ secrets.VPS_DEPLOY_DIR }}'"
          scp docker-compose.prod.yml "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_DIR }}/docker-compose.prod.yml"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p '${{ secrets.VPS_DEPLOY_DIR }}/deployment'"
          scp deployment/Caddyfile "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_DIR }}/deployment/Caddyfile"
          scp deployment/provision-db-roles.sh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_DIR }}/deployment/provision-db-roles.sh"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cp '${{ secrets.VPS_DEPLOY_DIR }}/deployment/Caddyfile' '${{ secrets.VPS_DEPLOY_DIR }}/Caddyfile'"
      - name: Authenticate VPS to GHCR (private packages only)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          if [ -n "$GHCR_TOKEN" ]; then
            printf '%s' "$GHCR_TOKEN" | ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          fi
      - name: Migrate and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "cd '$VPS_DEPLOY_DIR' && INVENTORY_IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          test -f .env.production || { echo "missing .env.production on VPS; see .env.production.example"; exit 1; }
          if grep -q '^INVENTORY_IMAGE=' .env.production; then
            sed -i "s#^INVENTORY_IMAGE=.*#INVENTORY_IMAGE=$INVENTORY_IMAGE#" .env.production
          else
            echo "INVENTORY_IMAGE=$INVENTORY_IMAGE" >> .env.production
          fi
          docker compose --env-file .env.production -f docker-compose.prod.yml pull
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --wait postgres redis
          bash deployment/provision-db-roles.sh
          docker compose --env-file .env.production -f docker-compose.prod.yml run --rm --no-TTY migrate </dev/null
          # Existing DBs at head 0030 still need the auth-service role grants; fresh DBs get them in 0030.
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres sh -c \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "ALTER ROLE platform_auth BYPASSRLS; GRANT USAGE ON SCHEMA platform TO platform_auth; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA platform TO platform_auth; GRANT DELETE ON item_master.item_related, item_master.kit_group_member TO platform_app;"'
          # Existing DBs also need the global-currency RLS policy and the canonical traceability flag.
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres sh -c \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          DROP POLICY IF EXISTS global_currency_read ON platform.currency;
          CREATE POLICY global_currency_read ON platform.currency FOR SELECT USING (tenant_id IS NULL);
          INSERT INTO platform.feature_flag (id, tenant_id, flag_key, is_enabled, source, created_at, updated_at, version)
          SELECT gen_random_uuid(), t.id, 'traceability.registry.enabled', false, 'BACKFILL', now(), now(), 1
          FROM platform.tenant t
          WHERE t.id <> '00000000-0000-0000-0000-000000000000'::uuid
            AND NOT EXISTS (SELECT 1 FROM platform.feature_flag f WHERE f.tenant_id = t.id AND f.flag_key = 'traceability.registry.enabled');
          SQL
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans --force-recreate api worker outbox-relay caddy
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T api \
            python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=10).read().decode())"
          REMOTE
