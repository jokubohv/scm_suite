name: diagnose-rt2
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Collect API logs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "cd '$VPS_DEPLOY_DIR' && docker compose --env-file .env.production -f docker-compose.prod.yml ps; echo '=== API LOGS ==='; docker compose --env-file .env.production -f docker-compose.prod.yml logs api --no-color --tail 8000" > /tmp/api.logs 2>&1 || true
          echo '=== matching traceback lines ==='
          grep -n -E 'dcfca262|5198d7df|a8d66d6c|b9fbc386|Traceback|unhandled error|ERROR' /tmp/api.logs | tail -200 || true
          echo '=== tail ==='
          tail -400 /tmp/api.logs
